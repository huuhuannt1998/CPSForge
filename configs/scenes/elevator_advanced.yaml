    category: internal
    scene_name: elevator_advanced

  - name: enable
    address: "DB12,BOOL104.0"
    data_type: bool
    access: read_write
    description: "System enable — never written by PLC (attack target)"
    category: mode_bit
    scene_name: elevator_advanced

  - name: item_count
    address: "DB12,INT106"
    data_type: int
    access: read_write
    min_value: 0
    max_value: 10
    description: "Items collected in current box (attack target)"
    category: internal
    scene_name: elevator_advanced

  - name: max_items
    address: "DB12,INT108"
    data_type: int
    access: read_write
    min_value: 1
    max_value: 10
    description: "Target items per box (default 5, attack target)"
    category: setpoint
    scene_name: elevator_advanced

writable_tags:
  - conveyor_0
  - conveyor_1
  - conveyor_2
  - conveyor_3
  - exit_conveyor
  - load
  - unload
  - up
  - down
  - slow
  - enable
  - item_count
  - max_items

attack_surface:
  - up
  - down
  - load
  - unload
  - enable
  - item_count
  - max_items

safety_rules:
  - rule_id: EA-SR-001
    description: "UP and DOWN must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [up, down]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 100

  - rule_id: EA-SR-002
    description: "Load and unload must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [load, unload]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 90

  - rule_id: EA-SR-003
    description: "Enable must not be held FALSE for more than 30 seconds"
    rule_type: duration
    tags: [enable]
    parameters:
      max_duration_ms: 30000
      forbidden_value: false
    enabled: true
    priority: 100

  - rule_id: EA-SR-004
    description: "ItemCount must stay within valid range"
    rule_type: range
    tags: [item_count]
    parameters:
      min: 0
      max: 10
    enabled: true
    priority: 80

  - rule_id: EA-SR-005
    description: "MaxItems must stay within valid range"
    rule_type: range
    tags: [max_items]
    parameters:
      min: 1
      max: 10
    enabled: true
    priority: 80

reset_procedure:
  - tag: enable
    value: true
  - tag: up
    value: false
  - tag: down
    value: false
  - tag: slow
    value: false
  - tag: load
    value: false
  - tag: unload
    value: false
  - tag: item_count
    value: 0
  - tag: max_items
    value: 5
