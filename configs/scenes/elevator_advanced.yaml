    category: actuator
    scene_name: elevator_advanced

  - name: red_3
    address: "DB12,BOOL88.0"
    data_type: bool
    access: read
    description: "Floor 3 red light"
    category: actuator
    scene_name: elevator_advanced

  - name: display
    address: "DB12,DINT90"
    data_type: dint
    access: read
    description: "Floor display (items collected)"
    category: internal
    scene_name: elevator_advanced

  # --- Internal state ---
  - name: state
    address: "DB12,INT94"
    data_type: int
    access: read
    min_value: 0
    max_value: 5
    description: "State: 0=LoadBox, 1=Scan, 2=Moving, 3=Collect, 4=Return, 5=Unload"
    category: internal
    scene_name: elevator_advanced

  - name: target_floor
    address: "DB12,INT96"
    data_type: int
    access: read
    description: "Target floor (0-3)"
    category: internal
    scene_name: elevator_advanced

  - name: current_floor
    address: "DB12,INT98"
    data_type: int
    access: read
    description: "Current floor (0-3)"
    category: internal
    scene_name: elevator_advanced

  - name: dwell_timer
    address: "DB12,INT100"
    data_type: int
    access: read
