# =============================================================================
# CPSForge Scene Configuration — Elevator (Advanced)
# =============================================================================
# Factory I/O scene: Elevator (Advanced)
# DB19: Instance DB for FB_ElevatorAdvanced (non-optimized, 110 bytes)
#
# Physical setup:
#   - Siemens S7 PLC at 192.168.0.1, TIA Portal v17
#   - Single elevator servicing 4 floors (0-3)
#   - Items arrive randomly at floors 1-3
#   - Elevator carries a box, collects items (max 5)
#   - Full box unloaded at floor 0
#   - Dual sensors per floor (Low+High), traffic lights, panel
#   - Enable vulnerability
#
# Attack surface: Elevator controls, ItemCount, MaxItems, Enable
# =============================================================================

scene_name: elevator_advanced
scene_id: 10  # OB_Main CASE 10 — DB12

description: >
  Advanced single-elevator system across 4 floors. Collects up to 5 items
  into a box. Items spawn randomly at floors 1-3. 6-state machine:
  LoadBox→Scan→Moving→Collect→Return→Unload. Enable flag and ItemCount
  are attack targets.

sampling_interval_ms: 500

tags:
  # --- Floor call sensors ---
  - name: at_1
    address: "DB12,BOOL0.0"
    data_type: bool
    access: read
    description: "Floor 1 call — item waiting"
    category: sensor
    scene_name: elevator_advanced

  - name: at_2
    address: "DB12,BOOL2.0"
    data_type: bool
    access: read
    description: "Floor 2 call — item waiting"
    category: sensor
    scene_name: elevator_advanced

  - name: at_3
    address: "DB12,BOOL4.0"
    data_type: bool
    access: read
    description: "Floor 3 call — item waiting"
    category: sensor
    scene_name: elevator_advanced

  - name: at_elevator
    address: "DB12,BOOL6.0"
    data_type: bool
    access: read
    description: "Item on elevator platform"
    category: sensor
    scene_name: elevator_advanced

  - name: at_entry
    address: "DB12,BOOL8.0"
    data_type: bool
    access: read
