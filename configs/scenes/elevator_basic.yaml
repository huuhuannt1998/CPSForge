# =============================================================================
# CPSForge Scene Configuration — Elevator (Basic)
# =============================================================================
# Factory I/O scene: Elevator (Basic)
# DB20: Instance DB for FB_ElevatorBasic (non-optimized, 128 bytes)
#
# Physical setup:
#   - Siemens S7 PLC at 192.168.0.1, TIA Portal v17
#   - Two elevators: Left (L0↔L1), Right (L1↔L2)
#   - Dual position sensors per floor (Low+High) for approach/arrival
#   - Traffic lights per level (Green/Yellow/Red)
#   - Control panel: Start/Stop/Reset/Emergency/Auto
#   - Enable vulnerability: read but never written
#
# Attack surface: Elevator controls, Enable flag
# =============================================================================

scene_name: elevator_basic
scene_id: 11  # OB_Main CASE 11 — DB13

description: >
  Two-elevator system spanning 3 levels. Left elevator shuttles between
  Level 0 and Level 1. Right elevator between Level 1 and Level 2. Each
  has a 4-state machine with dual-sensor floor detection and speed control.
  Full panel handling with safety gates and Enable vulnerability.

sampling_interval_ms: 500

