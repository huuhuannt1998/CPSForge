  # --- Position sensors ---
  - name: at_entry
    address: "DB13,BOOL0.0"
    data_type: bool
    access: read
    description: "Item at system entry"
    category: sensor
    scene_name: elevator_basic

  - name: at_entry_left
    address: "DB13,BOOL2.0"
