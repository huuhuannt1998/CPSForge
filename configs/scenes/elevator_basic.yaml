writable_tags:
  - entry_conveyor
  - unload_left
  - load_left
  - conveyor_0
  - unload_right
  - load_right
  - exit_conveyor
  - left_up
  - left_slow
  - left_down
  - right_up
  - right_slow
  - right_down
  - conveyor_1
  - conveyor_2
  - enable

attack_surface:
  - left_up
  - left_down
  - right_up
  - right_down
  - load_left
  - unload_left
  - load_right
  - unload_right
  - enable

safety_rules:
  - rule_id: EB-SR-001
    description: "Left elevator UP and DOWN must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [left_up, left_down]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 100

  - rule_id: EB-SR-002
    description: "Right elevator UP and DOWN must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [right_up, right_down]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 100

  - rule_id: EB-SR-003
    description: "Enable must not be held FALSE for more than 30 seconds"
    rule_type: duration
    tags: [enable]
    parameters:
      max_duration_ms: 30000
      forbidden_value: false
    enabled: true
    priority: 100

  - rule_id: EB-SR-004
    description: "Left load and unload must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [load_left, unload_left]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 90

  - rule_id: EB-SR-005
    description: "Right load and unload must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [load_right, unload_right]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 90

reset_procedure:
  - tag: enable
    value: true
  - tag: left_up
    value: false
  - tag: left_down
    value: false
  - tag: left_slow
    value: false
  - tag: right_up
    value: false
  - tag: right_down
    value: false
  - tag: right_slow
    value: false
  - tag: load_left
    value: false
  - tag: unload_left
    value: false
  - tag: load_right
    value: false
  - tag: unload_right
    value: false
