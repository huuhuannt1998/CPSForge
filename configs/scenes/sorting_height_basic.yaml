# ---------------------------------------------------------------------------
# Writable Tags
# ---------------------------------------------------------------------------
writable_tags:
  - conveyor_entry
  - load_act
  - unload_act
  - transf_left
  - transf_right
  - conveyor_left
  - conveyor_right
  - enable

# ---------------------------------------------------------------------------
# Attack Surface
# ---------------------------------------------------------------------------
attack_surface:
  - conveyor_entry
  - load_act
  - unload_act
  - transf_left
  - transf_right
  - conveyor_left
  - conveyor_right
  - enable

# ---------------------------------------------------------------------------
# Safety Rules
# ---------------------------------------------------------------------------
safety_rules:

  - rule_id: SH-SR-001
    description: "TransfLeft and TransfRight must not be active simultaneously"
    rule_type: mutual_exclusion
    tags: [transf_left, transf_right]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 100

  - rule_id: SH-SR-002
    description: "Enable must not be held FALSE for more than 30 seconds"
    rule_type: duration
    tags: [enable]
    parameters:
      max_duration_ms: 30000
      forbidden_value: false
    enabled: true
    priority: 100

  - rule_id: SH-SR-003
    description: "Conveyor entry override duration capped at 20 seconds"
    rule_type: duration
    tags: [conveyor_entry]
    parameters:
      max_duration_ms: 20000
    enabled: true
    priority: 50

  - rule_id: SH-SR-004
    description: "Load and unload must not activate simultaneously"
    rule_type: mutual_exclusion
    tags: [load_act, unload_act]
    parameters:
      forbidden_pairs: [[true, true]]
    enabled: true
    priority: 90

# ---------------------------------------------------------------------------
# Reset Procedure
# ---------------------------------------------------------------------------
reset_procedure:
  - tag: enable
    value: true
  - tag: conveyor_entry
    value: false
  - tag: load_act
    value: false
  - tag: unload_act
    value: false
  - tag: transf_left
    value: false
  - tag: transf_right
    value: false
  - tag: conveyor_left
    value: false
  - tag: conveyor_right
    value: false
