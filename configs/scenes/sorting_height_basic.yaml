# =============================================================================
# CPSForge Scene Configuration — Sorting by Height (Basic)
# =============================================================================
# Factory I/O scene: Sorting by Height (Basic)
# DB21: Instance DB for FB_SortingHeightBasic (non-optimized, 62 bytes)
#
# Physical setup:
#   - Siemens S7 PLC at 192.168.0.1, TIA Portal v17
#   - Entry conveyor feeds items onto loading area
#   - High/Low sensors determine item height
#   - Short items (low only) → transfer LEFT
#   - Tall items (high sensor) → transfer RIGHT
#   - Left and right exit conveyors carry sorted items
#   - 5-state machine: Feed→Load→Transfer→Clear→Finish
#
# Attack surface: conveyors, transfer gates, enable flag
# =============================================================================

scene_name: sorting_height_basic
scene_id: 19  # OB_Main CASE 19 — DB21

description: >
  Sorting by height scene with 5-state machine. Items arrive on entry
  conveyor, are measured by height sensors, and sorted: short items go
  LEFT, tall items go RIGHT. The Enable flag is never written by PLC
  logic. Transfer left/right are mutual-exclusion actuators.

sampling_interval_ms: 500

# ---------------------------------------------------------------------------
# Tag Definitions (DB21, 62 bytes total)
# ---------------------------------------------------------------------------
tags:

  # --- Sensors ---
  - name: high_sensor
    address: "DB21,BOOL0.0"
    data_type: bool
    access: read
    unit: null
    min_value: null
    max_value: null
    description: "Height sensor — TRUE if tall item detected"
    category: sensor
    scene_name: sorting_height_basic

  - name: low_sensor
    address: "DB21,BOOL2.0"
    data_type: bool
    access: read
    unit: null
    min_value: null
    max_value: null
    description: "Low sensor — TRUE if any item present"
    category: sensor
    scene_name: sorting_height_basic

  - name: pallet_sensor
