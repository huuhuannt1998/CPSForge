# =============================================================================
# CPSForge Attack Policy — LLM (Queue Items)
# =============================================================================
name: llm_queue_items
attacker_type: llm
scene_name: queue_items
llm_provider: local_openai_compatible
llm_model: null
llm_max_retries: 3
multi_step: false
max_actions: 2
inter_attack_delay_ms: 2000
attack_types:
- actuator_override
- setpoint_shift
- sensor_spoof
- sequence_perturbation
- timing_delay
parameters:
  attacker_objective: 'Disrupt the queue items process. Counter-based queue: load
    3 boxes onto conveyor (counted by AtEntry rising edge), then unload via AtExit
    sensor. Two states: Loading and Unloading. Writable targets: conveyor, emitter,
    remover, target_count. Try to cause state machine inconsistencies or stuck states.
    The defender uses threshold and invariant checks.'
  prompt_notes: 'Attack surface: conveyor, emitter, remover, target_count. Setpoints:
    target_count. Sensors (read-only): at_entry, at_exit. Actuators: conveyor, emitter,
    remover.'
