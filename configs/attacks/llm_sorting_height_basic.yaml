# CPSForge Attack Policy Config -- LLM Attacker for Sorting by Height (Basic)
# =============================================================================
# Uses the local OpenAI-compatible provider (LM Studio) by default.
#
# Run a dry-run LLM attack with:
#   cpsforge run attack --scene sorting_height_basic --attacker llm_sorting_height_basic
#
# For a live eval run (requires PLC connection and LM Studio running):
#   cpsforge run attack \
#     --scene sorting_height_basic --attacker llm_sorting_height_basic \
#     --experiment configs/experiments/llm_eval_sorting.yaml

name: llm_sorting_height_basic
attacker_type: llm
scene_name: sorting_height_basic

# LLM provider settings
llm_provider: local_openai_compatible
llm_model: null                # null = use model from configs/llm/local.yaml
llm_max_retries: 3

multi_step: false
max_actions: 3

inter_attack_delay_ms: 2000

attack_types:
  - actuator_override
  - sequence_perturbation
  - timing_delay

parameters:
  attacker_objective: >
    Cause mis-sorting of items in the sorting-by-height process. The system
    sorts short items LEFT and tall items RIGHT. Your goal is to cause items
    to be routed to the wrong conveyor, jam the transfer mechanism, or halt
    the sorting process. Both transfer gates are mutual-exclusion actuators.
    The enable flag is never written by PLC logic — disabling it stops all
    processing. The defender monitors state transitions and mutual exclusion.
  prompt_notes: >
    Key attack surface: conveyor_entry, load_act, unload_act, transf_left,
    transf_right, enable. The state machine has 5 states (Feed→Load→Transfer→
    Clear→Finish). Activating both transf_left and transf_right simultaneously
    will be blocked by the shield. More subtle attacks: override transf_left
    when is_tall=TRUE to mis-sort, or toggle enable briefly to drop items.
