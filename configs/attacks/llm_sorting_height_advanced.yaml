# =============================================================================
# CPSForge Attack Policy — LLM (Sorting Height Advanced)
# =============================================================================
name: llm_sorting_height_advanced
attacker_type: llm
scene_name: sorting_height_advanced
llm_provider: local_openai_compatible
llm_model: null
llm_max_retries: 3
multi_step: false
max_actions: 2
inter_attack_delay_ms: 2000
attack_types:
- actuator_override
- sequence_perturbation
- timing_delay
parameters:
  attacker_objective: 'Disrupt the sorting height advanced process. Advanced turntable-based
    height sorting. Items are detected by HighBox/LowBox sensors, loaded onto turntable,
    rotated to the correct exit (tall→LEFT 270°CW, short→RIGHT 90°CW), and unloaded.
    11-state machine with timer-based 270° rotation for LEFT. Writable targets: load_act,
    unload_act, turn_act, enable. The enable flag is never written by PLC logic —
    disabling it halts the process. Try to cause state machine inconsistencies or
    stuck states. The defender uses threshold and invariant checks.'
  prompt_notes: 'Attack surface: load_act, unload_act, turn_act, enable. Sensors (read-only):
    at_entry, low_box, high_box, at_turntable_entry, at_load_position, at_unload_position.
    Actuators: feeder_conveyor, entry_conveyor, load_act, unload_act, turn_act, left_conveyor.'
