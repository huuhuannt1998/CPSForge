# =============================================================================
# CPSForge Attack Policy — LLM (From A To B Sr)
# =============================================================================
name: llm_from_a_to_b_sr
attacker_type: llm
scene_name: from_a_to_b_sr
llm_provider: local_openai_compatible
llm_model: null
llm_max_retries: 3
multi_step: false
max_actions: 2
inter_attack_delay_ms: 2000
attack_types:
- actuator_override
- sequence_perturbation
parameters:
  attacker_objective: 'Disrupt the from a to b sr process. Set/Reset conveyor transport.
    SensorA sets conveyor ON, SensorB resets conveyor OFF. The ConveyorRunning latch
    tracks motor state. Enable flag is never written by PLC logic — persistent attack
    target. Writable targets: conveyor, enable. The enable flag is never written by
    PLC logic — disabling it halts the process. The defender uses threshold and invariant
    checks.'
  prompt_notes: 'Attack surface: conveyor, enable. Sensors (read-only): sensor_a,
    sensor_b. Actuators: conveyor.'
