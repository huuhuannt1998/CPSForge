# =============================================================================
# CPSForge Attack Policy — LLM (Buffer Station)
# =============================================================================
name: llm_buffer_station
attacker_type: llm
scene_name: buffer_station
llm_provider: local_openai_compatible
llm_model: null
llm_max_retries: 3
multi_step: false
max_actions: 2
inter_attack_delay_ms: 2000
attack_types:
- actuator_override
- sequence_perturbation
- timing_delay
parameters:
  attacker_objective: 'Disrupt the buffer station process. Buffer station that holds
    up to 5 boxes. Boxes arrive and are held by stoppers. Release logic uses a 3-state
    cycle to separate boxes one at a time onto the output conveyor. Writable targets:
    conveyor, stopper1, stopper2. Try to cause state machine inconsistencies or stuck
    states. The defender uses threshold and invariant checks.'
  prompt_notes: 'Attack surface: conveyor, stopper1, stopper2. Sensors (read-only):
    sensor1, sensor2, sensor3, sensor4, sensor5, at_exit. Actuators: conveyor, stopper1,
    stopper2, emitter, remover.'
