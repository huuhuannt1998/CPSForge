# =============================================================================
# CPSForge Attack Policy — LLM (Pick Place Xyz)
# =============================================================================
name: llm_pick_place_xyz
attacker_type: llm
scene_name: pick_place_xyz
llm_provider: local_openai_compatible
llm_model: null
llm_max_retries: 3
multi_step: false
max_actions: 3
inter_attack_delay_ms: 3000
attack_types:
- actuator_override
- setpoint_shift
- sensor_spoof
- sequence_perturbation
- timing_delay
parameters:
  attacker_objective: 'Disrupt the pick place xyz process. Three-axis manipulator
    places boxes onto pallets in a 3x3 grid pattern (9 boxes per pallet). REAL analog
    setpoints control arm position. 7-state machine manages the pick-move-place cycle.
    Writable targets: setpoint_x, setpoint_y, setpoint_z, gripper. This scene has
    analog (REAL) values — gradual shifts may evade threshold detectors. Try to cause
    state machine inconsistencies or stuck states. The defender uses threshold and
    invariant checks.'
  prompt_notes: 'Attack surface: setpoint_x, setpoint_y, setpoint_z, gripper. Setpoints:
    setpoint_x, setpoint_y, setpoint_z. Sensors (read-only): box_at_pick, pallet_ready,
    gripper_closed, pos_x, pos_y, pos_z. Actuators: gripper, conveyor_in, conveyor_pallet,
    emitter.'
