# =============================================================================
# CPSForge Defender — Invariant (Warehouse)
# =============================================================================
name: invariant_warehouse
detector_type: invariant
scene_name: warehouse
enabled: true
invariant_rules:
- rule_id: W-INV-001
  description: Fork extend and retract must not be active simultaneously
  condition: NOT (fork_extend == True AND fork_retract == True)
  tags:
  - fork_extend
  - fork_retract
  severity: critical
  label: fork_extend_fork_retract_conflict
- rule_id: W-INV-002
  description: State must be within valid range [0, 3]
  condition: NOT (state < 0 OR state > 3)
  tags:
  - state
  severity: high
  label: invalid_state_range
- rule_id: W-INV-003
  description: crane_move_x must be in [0.0, 1500.0]
  condition: NOT (crane_move_x < 0.0 OR crane_move_x > 1500.0)
  tags:
  - crane_move_x
  severity: high
  label: crane_move_x_out_of_range
- rule_id: W-INV-004
  description: crane_move_z must be in [0.0, 1000.0]
  condition: NOT (crane_move_z < 0.0 OR crane_move_z > 1000.0)
  tags:
  - crane_move_z
  severity: high
  label: crane_move_z_out_of_range
