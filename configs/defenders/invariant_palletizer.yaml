# =============================================================================
# CPSForge Defender — Invariant (Palletizer)
# =============================================================================
name: invariant_palletizer
detector_type: invariant
scene_name: palletizer
enabled: true
invariant_rules:
- rule_id: P-INV-001
  description: State must be within valid range [0, 6]
  condition: NOT (state < 0 OR state > 6)
  tags:
  - state
  severity: high
  label: invalid_state_range
- rule_id: P-INV-002
  description: move_x must be in [0.0, 1000.0]
  condition: NOT (move_x < 0.0 OR move_x > 1000.0)
  tags:
  - move_x
  severity: high
  label: move_x_out_of_range
- rule_id: P-INV-003
  description: move_z must be in [0.0, 500.0]
  condition: NOT (move_z < 0.0 OR move_z > 500.0)
  tags:
  - move_z
  severity: high
  label: move_z_out_of_range
