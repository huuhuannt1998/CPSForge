# CPSForge LLM Provider Config -- HuggingFace (Qwen2.5-3B-Instruct)
# ==================================================================
# Cross-family comparator for RQ5.
# Qwen2.5-3B-Instruct is a different generation within the Qwen family.
#
# To pre-download:
#   huggingface-cli download Qwen/Qwen2.5-3B-Instruct --local-dir models/qwen2.5-3b-instruct
#   Then set model: models/qwen2.5-3b-instruct
#
# Requirements:
#   pip install transformers>=5.0 accelerate bitsandbytes>=0.43
#
# GPU VRAM: ~2 GB inference in 4-bit (well within A4000 16 GB)

provider: huggingface
model: models/qwen2.5-3b-instruct       # local path — use after download completes
# model: Qwen/Qwen2.5-3B-Instruct      # HF Hub name if local path not yet downloaded
adapter_path: null                       # no adapter (base-only comparator)
load_in_4bit: true                       # 4-bit NF4 via bitsandbytes

max_tokens: 512
temperature: 0.2
timeout_s: 300.0

# Not used by HuggingFace provider (no HTTP server)
api_key_env: ""
base_url: null

# Logging controls
log_prompts: false
redact_prompts: false
log_llm_responses: true

prompt_template_version: "v2"
