# CPSForge LLM Provider Config -- Local OpenAI-Compatible (LM Studio)
# =====================================================================
# Targets any local model server that exposes an OpenAI-compatible
# /v1/chat/completions endpoint.  Primary target: LM Studio.
#
# Start LM Studio, load a model, and enable the local server.
# Default endpoint: http://127.0.0.1:1234/v1
#
# To compare multiple models, create one config per model and reference
# them in separate attack-policy configs (one model per run).

provider: local_openai_compatible
model: qwen2-7b-instruct       # model loaded in LM Studio
api_key_env: ""                 # not used; leave blank

# Base URL of the OpenAI-compatible server (LM Studio default)
base_url: http://127.0.0.1:1234/v1

max_tokens: 1024
temperature: 0.2
timeout_s: 120.0                # local models may be slower; increase if needed

# Logging controls
log_prompts: false
redact_prompts: false
log_llm_responses: true

prompt_template_version: "v2"
