# CPSForge LLM Provider Config -- HuggingFace (Llama-3.2-3B-Instruct)
# ==================================================================
# Cross-family comparator for RQ2.
# Llama-3.2-3B-Instruct is a Meta decoder-only model (~3B params).
# GATED: requires accepting Meta's license and a valid HF_TOKEN.
#
# To accept the license:
#   https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct
#
# To pre-download:
#   export HF_TOKEN=hf_...
#   huggingface-cli download meta-llama/Llama-3.2-3B-Instruct \
#       --local-dir models/llama3.2-3b-instruct --token $HF_TOKEN
#
# Requirements:
#   pip install transformers>=5.0 accelerate bitsandbytes>=0.43
#
# GPU VRAM: ~2 GB inference in 4-bit (well within A4000 16 GB)
# Expected throughput: ~80-100 tok/s in 4-bit on RTX A4000

provider: huggingface
model: models/llama3.2-3b-instruct   # local path — use after download completes
# model: meta-llama/Llama-3.2-3B-Instruct  # HF Hub name (requires HF_TOKEN)
adapter_path: null                   # no adapter (base-only comparator)
load_in_4bit: true                   # 4-bit NF4 via bitsandbytes

max_tokens: 300
temperature: 0.2
timeout_s: 300.0

# Not used by HuggingFace provider (no HTTP server)
api_key_env: ""
base_url: null

# Logging controls
log_prompts: false
redact_prompts: false
log_llm_responses: true

prompt_template_version: "v2"
