# CPSForge LLM Provider Config -- HuggingFace (Phi-4-mini-instruct)
# ==================================================================
# Cross-family comparator for RQ5.
# Phi-4-mini-instruct is Microsoft's compact reasoning model (~3.8B params).
#
# To pre-download:
#   huggingface-cli download microsoft/Phi-4-mini-instruct --local-dir models/phi-4-mini-instruct
#   Then set model: models/phi-4-mini-instruct
#
# Requirements:
#   pip install transformers>=5.0 accelerate bitsandbytes>=0.43
#
# GPU VRAM: ~3 GB inference in 4-bit (well within A4000 16 GB)

provider: huggingface
model: models/phi-4-mini-instruct        # local path — use after download completes
# model: microsoft/Phi-4-mini-instruct  # HF Hub name if local path not yet downloaded
adapter_path: null                       # no adapter (base-only comparator)
load_in_4bit: true                       # 4-bit NF4 via bitsandbytes

max_tokens: 300
temperature: 0.2
timeout_s: 300.0

# Not used by HuggingFace provider (no HTTP server)
api_key_env: ""
base_url: null

# Logging controls
log_prompts: false
redact_prompts: false
log_llm_responses: true

prompt_template_version: "v2"
