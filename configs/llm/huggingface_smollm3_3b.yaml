# CPSForge LLM Provider Config -- HuggingFace (SmolLM3-3B)
# ==================================================================
# Cross-family comparator for RQ5.
# SmolLM3-3B is HuggingFace's efficient small language model.
#
# To pre-download:
#   huggingface-cli download HuggingFaceTB/SmolLM3-3B --local-dir models/smollm3-3b
#   Then set model: models/smollm3-3b
#
# Requirements:
#   pip install transformers>=5.0 accelerate bitsandbytes>=0.43
#
# GPU VRAM: ~2 GB inference in 4-bit (well within A4000 16 GB)

provider: huggingface
model: models/smollm3-3b                # local path — use after download completes
# model: HuggingFaceTB/SmolLM3-3B      # HF Hub name if local path not yet downloaded
adapter_path: null                       # no adapter (base-only comparator)
load_in_4bit: true                       # 4-bit NF4 via bitsandbytes

max_tokens: 300
temperature: 0.2
timeout_s: 300.0

# Not used by HuggingFace provider (no HTTP server)
api_key_env: ""
base_url: null

# Logging controls
log_prompts: false
redact_prompts: false
log_llm_responses: true

prompt_template_version: "v2"
