# =============================================================================
# CPSForge Live Eval — Random Attacks on Level Control
# =============================================================================
# REAL PLC WRITES — ensure Factory I/O is in PLAY mode before running.
#
# Usage:
#   cpsforge run attack --scene level_control --experiment live_random_level_control --no-dry-run --eval-run
# =============================================================================

name: live_random_level_control
description: >
  Live eval run: random attacker vs threshold + invariant detectors on
  the Level Control tank scene. Real PLC writes enabled.

scene_config: "scenes/level_control.yaml"
plc_config: "system/plc.yaml"

attackers:
  - random_level_control

defenders:
  - threshold_level_control
  - invariant_level_control

live_writes_enabled: true
dry_run: false
eval_run: true

max_steps: 200
run_duration_s: 180.0

save_trace: true
save_metrics: true
reset_after_run: true
