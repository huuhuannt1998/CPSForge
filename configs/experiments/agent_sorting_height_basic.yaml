attackers: []

defenders:
  - threshold_sorting_height_basic
  - invariant_sorting_height_basic

attacker_agent: attacker_agent
defender_agent: defender_agent

live_writes_enabled: true
dry_run: false
eval_run: true

max_steps: 200
run_duration_s: null

save_trace: true
save_metrics: true
reset_after_run: true
