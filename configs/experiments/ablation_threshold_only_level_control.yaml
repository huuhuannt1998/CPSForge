# =============================================================================
# CPSForge Ablation — Threshold Detector Only (Level Control)
# =============================================================================
# Tests threshold detector alone without invariant detector.
# Part of the defense ablation study.
#
# Usage:
#   cpsforge run attack --scene level_control --experiment ablation_threshold_only_level_control --no-dry-run --eval-run
# =============================================================================

name: ablation_threshold_only_level_control
description: >
  Ablation study: threshold detector only on Level Control.
  Isolates the contribution of rule-based threshold detection.

scene_config: "scenes/level_control.yaml"
plc_config: "system/plc.yaml"

attackers:
  - scripted_level_control

defenders:
  - threshold_level_control

live_writes_enabled: true
dry_run: false
eval_run: true

max_steps: 150
run_duration_s: 150.0

save_trace: true
save_metrics: true
reset_after_run: true
