# =============================================================================
# CPSForge Live Agent Mode — From A to B
# =============================================================================
# REAL PLC WRITES — ensure Factory I/O is in PLAY mode before running.
#
# Usage:
#   cpsforge run agent --scene from_a_to_b --experiment agent_from_a_to_b --no-dry-run --eval-run
# =============================================================================

name: agent_from_a_to_b
description: >
  Live attacker and defender agents running independently with
  coordinator-mediated shield writes on From A to B scene.

mode: agent
scene_config: "scenes/from_a_to_b.yaml"
plc_config: "system/plc.yaml"

attackers: []

defenders:
  - threshold_from_a_to_b
  - invariant_from_a_to_b

attacker_agent: attacker_agent
defender_agent: defender_agent

live_writes_enabled: true
dry_run: false
eval_run: true

max_steps: 200
run_duration_s: null

save_trace: true
save_metrics: true
reset_after_run: true
