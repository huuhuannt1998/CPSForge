# =============================================================================
# EXP-2: Maroochy-style persistent multi-cycle actuator override
# Scene: Level Control
# =============================================================================
# Inspired by the 2000 Maroochy Shire sewage attack: an insider-equivalent
# adversary with authenticated access performs persistent, repeated actuator
# overrides over hundreds of cycles, wearing down the process over time.
#
# Key differences from baseline (RQ1-RQ4):
#   - 300 steps (vs 60) — long-horizon run to test persistence strategy
#   - attack_budget: 40 (vs 10) — more attack opportunities
#   - context_level: partial — enough info to target, not so much it self-deters
#   - No defense (measures raw persistent attack capability)
#
# Run (PowerShell, from repo root):
#   py -3 -m cpsforge.runner.online_runner `
#     --config configs/experiments/exp02_maroochy_level_control.yaml `
#     --live
# =============================================================================

name: exp02_maroochy_level_control
description: >
  EXP-2 Maroochy: 300-step persistent actuator override on Level Control.
  Qwen2.5-3B (base), partial context, no defense, 40-attack budget.

scene_config: "scenes/level_control.yaml"
plc_config: "system/plc.yaml"

attackers:
  - online_mitm

defenders: []

live_writes_enabled: false   # override with --live flag
dry_run: false
eval_run: true

max_steps: 300
run_duration_s: 1800.0       # 30-minute wall-clock limit

save_trace: true
save_metrics: true
reset_after_run: true

v2:
  context_level: "partial"
  model_variant: "qwen25_3b"
  finetune_status: "base"
  defense_variant: "none"
  attack_budget: 40
  decision_interval_steps: 3
  prompt_objective: "maroochy"

# EXP metadata (for analysis tagging)
exp_id: "EXP-2"
exp_name: "maroochy"
exp_variant: "level_control"
